name: ita-local

services:
  gateway:
    image: nginx:alpine
    profiles: ["full"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      challenge-service:
        condition: service_healthy
      user-service:
        condition: service_healthy

  frontend:
    profiles: ["full", "frontend"]
    build:
      context: ./frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  challenge-service:
    profiles: ["full", "backend"]
    build:
      context: ./backend
      dockerfile: ./challenge-service/Dockerfile
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  user-service:
    profiles: ["full", "backend"]
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
