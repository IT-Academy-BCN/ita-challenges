name: ita-backend (CI)

on:
  workflow_dispatch:
  push:
    branches: [develop, staging, main]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [staging, main]
    paths: [ 'backend/**' ]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure gradlew is executable
        run: chmod +x backend/gradlew

      - name: Gradle build (skip tests)
        run: backend/gradlew :challenge-service:bootJar :user-service:bootJar -x test --no-daemon

  docker-build:
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - uses: actions/checkout@v4

      - name: Build challenge-service image
        run: docker build -t challenge-service -f backend/challenge-service/Dockerfile backend

      - name: Build user-service image
        run: docker build -t user-service -f backend/user-service/Dockerfile backend