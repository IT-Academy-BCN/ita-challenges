name: ita-backend (CI)

on:
  workflow_dispatch:
  push:
    branches: [develop, staging, main]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  pull_request:
    branches: [develop, staging, main]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build:
    name: Build bootJars (skip tests for now)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure gradlew is executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Gradle build (skip tests)
        working-directory: backend
        run: |
          ./gradlew --version
          ./gradlew :challenge-service:bootJar :account-service:bootJar -x test --no-daemon

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: gradle-build
    steps:
      - uses: actions/checkout@v4

      - name: Build challenge-service image
        working-directory: backend
        run: docker build -t challenge-service -f challenge-service/Dockerfile .

      - name: Build account-service image
        working-directory: backend
        run: docker build -t account-service -f account-service/Dockerfile .
