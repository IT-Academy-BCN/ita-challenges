name: ita-backend (CI)

on:
  workflow_dispatch:
  push:
    branches: [develop, staging, main]
    paths:
      - backend/**
  pull_request:
    branches: [staging, main]
    paths:
      - backend/**

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Gradle build (skip tests)
        run: ./gradlew :challenge-service:bootJar :user-service:bootJar -x test --no-daemon

  docker-build:
    runs-on: ubuntu-latest
    needs: gradle-build
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t challenge-service -f challenge-service/Dockerfile .
      - run: docker build -t user-service -f user-service/Dockerfile .