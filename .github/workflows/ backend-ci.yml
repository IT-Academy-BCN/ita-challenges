name: ita-backend (CI)

on:
  workflow_dispatch:
  push:
    branches: [develop, staging, main]
    paths:
      - backend/**
  pull_request:
    branches: [staging, main]
    paths:
      - backend/**

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build:
    name: Build bootJars (skip tests for now)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Hello (sanity check)
        run: echo "Running on $GITHUB_REF for $GITHUB_REPOSITORY"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Gradle build (skip tests)
        run: ./gradlew :challenge-service:bootJar :user-service:bootJar -x test --no-daemon

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: gradle-build
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build challenge-service image
        run: docker build -t challenge-service -f challenge-service/Dockerfile .
      - name: Build user-service image
        run: docker build -t user-service -f user-service/Dockerfile .