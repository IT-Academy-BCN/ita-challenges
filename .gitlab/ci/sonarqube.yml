# SonarQube: (1) Gradle compiles Java, (2) SonarScanner CLI analyzes using those classes as artifacts.
# CI/CD variables: SONAR_TOKEN, SONAR_HOST_URL (see SonarQube onboarding in the UI).

stages:
  - sonar-compile
  - sonar-scan
  - build
  - deploy

.sonar-mr-rules: &sonar-mr-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Compile backend modules (classes required for sonar.java.binaries with the CLI).
sonar-compile:
  stage: sonar-compile
  image: gradle:8.10.0-jdk21-jammy
  variables:
    GIT_DEPTH: '0'
  cache:
    policy: pull-push
    key: 'sonar-gradle-cache-$CI_COMMIT_REF_SLUG'
    paths:
      - backend/.gradle/
  before_script:
    - cd backend
  script:
    - ./gradlew compileJava --no-daemon
  artifacts:
    paths:
      - backend/account-service/build/
      - backend/challenge-service/build/
    expire_in: 1 hour
  <<: *sonar-mr-rules

sonar-scan:
  stage: sonar-scan
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [ '' ]
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    policy: pull-push
    key: 'sonar-scanner-cache-$CI_COMMIT_REF_SLUG'
    paths:
      - '${SONAR_USER_HOME}/cache'
  needs:
    - job: sonar-compile
      artifacts: true
  script:
    - sonar-scanner -Dsonar.projectVersion=${CI_COMMIT_SHORT_SHA} -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: false
  <<: *sonar-mr-rules
