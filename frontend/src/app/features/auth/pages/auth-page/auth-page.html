<section class="auth">
    <h1>Login</h1>

    <button (click)="login()" [disabled]="loading()" class="auth__button">
        @if(loading()) {
            <span>Loading...</span>
        } @else {
            <span>Login with GitHub</span>
        }
    </button>

    @if (error()) {
        <p class="auth__error">Login failed. Try again.</p>
    }
    
</section>
