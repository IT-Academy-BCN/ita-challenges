
@if (challenge(); as ch) {
  <h1>{{ ch.title }}</h1>
  <p>{{ ch.description }}</p>
  <p>Dificultat: {{ getDifficultyLabel(ch.difficulty) }}</p>
  <p>Llenguatge: {{ getLanguageLabel(ch.language) }}</p>
}

@if (showModal()) {
<div class="modal-overlay">
  <div class="modal">
    <h2>Vols enviar la solució?</h2>
    <p>Escull com vols finalitzar el repte:</p>
    <div class="modal-actions">
      <button (click)="finishWithSolution()">Enviar i mostrar solució</button>
      <button (click)="finishWithoutSolution()">No enviar</button>
      <button (click)="closeModal()">Tornar enrere</button>
    </div>
  </div>
</div>
}
