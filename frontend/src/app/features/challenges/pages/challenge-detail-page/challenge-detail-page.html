<app-role-selector (roleChange)="onRoleChange($event)"></app-role-selector>

@if (challenge(); as ch) {
  <div class="challenge-container">
    <div class="challenge-header">
      <h1 class="challenge-title">{{ ch.title }}</h1>
      <p class="challenge-description">{{ ch.description }}</p>

      <div class="challenge-meta">
        <div class="meta-tag">
          <span class="meta-label">Dificultat: </span>
          <span class="meta-value">{{ getDifficultyLabel(ch.difficulty) }}</span>
        </div>
        <div class="meta-tag">
          <span class="meta-label">Llenguatge: </span>
          <span class="meta-value">{{ getLanguageLabel(ch.language) }}</span>
        </div>
      </div>
    </div>

    <div class="challenge-content">
      @if (!isMentor()) {
        <div class="challenge__actions">
          <button type="button" (click)="setProgrammingMode()">Començar repte</button>
        </div>

        @if (programmingMode()) {
          <form [formGroup]="codeSolutionForm" (ngSubmit)="saveSolution()" class="challenge__form">
            <textarea
              id="challengeAnswer"
              formControlName="code"
              rows="10"
              class="code-textarea"
              placeholder="Escriu aquí la resposta del repte...">
            </textarea>
            <div class="challenge__actions">
              <button type="submit" class="btn btn-secondary">Guardar</button>
              <button type="button" class="btn btn-primary" (click)="publishSolution()">Publicar</button>
            </div>
          </form>
        }
        @if (solutionRevealed()) {
          <div class="challenge__result">
            <h2>Solució oficial</h2>
            <textarea rows="10" readonly>{{ challenge()?.solution }}</textarea>
          </div>
        }
      }
    </div>
  </div>
}
