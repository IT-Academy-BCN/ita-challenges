
@if (challenge()) {
  <h1>{{ challenge()?.title }}</h1>
  <p>{{ challenge()?.description}}</p>
  <form [formGroup]="codeSolutionForm" (ngSubmit)="saveSolution()">
    <textarea
        id="challengeAnswer"
        formControlName="code"
        rows="10"
        placeholder="Escriu aquí la resposta del repte...">
      </textarea>
    <button type="submit">Guardar</button>
  </form>
}
