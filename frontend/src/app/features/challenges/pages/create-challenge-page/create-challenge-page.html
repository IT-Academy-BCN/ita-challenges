<form [formGroup]="challengeForm" (ngSubmit)="onSubmit()">
  <h2 class="form-section-title">
    <span class="form-section-badge">1</span>
    Informació general
  </h2>

  <div class="form-field">
    <label class="form-field-label" for="title">Títol</label>
    <input class="form-field-input" type="text" id="title" formControlName="title" />
  </div>

  <div>
    <label for="description">Descripció</label>
    <input type="text" id="description" formControlName="description">
  </div>

  <div>
    <label for="language">Llenguatge</label>
    <select id="language" formControlName="language">
      <option value="" selected disabled>Selecciona llenguatge</option>
      @for (language of languages; track language) {
        <option [value]="language">
          {{ language }}
        </option>
      }
    </select>
  </div>

  <div>
    <label for="difficulty">Dificultat</label>
    <select id="difficulty" formControlName="difficulty">
      <option value="" disabled>Selecciona dificultat</option>
      @for (difficulty of difficulties; track difficulty) {
        <option [value]="difficulty">
          {{ difficulty }}
        </option>
      }
    </select>
  </div>

  <div>
    <label for="solution">Solució oficial</label>
    <textarea id="solution" formControlName="solution"></textarea>
  </div>

  <button type="submit">Crear</button>
</form>
