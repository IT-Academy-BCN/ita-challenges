<form [formGroup]="editForm" (ngSubmit)="onSubmit()">

  <div>
    <label for="id">Id Repte</label>
    <input type="text" id="id" formControlName="id">
  </div>

  <div>
    <label for="title">Títol del Repte</label>
    <input type="text" id="title" formControlName="title">
  </div>

  <div>
    <label for="description">Descripció</label>
    <textarea
    id="description"
    formControlName="description"
    rows="5"
    placeholder="Escriu aquí els detalls del repte...">
  </textarea>
  </div>

  <button type="submit">Editar Repte</button>
</form>
