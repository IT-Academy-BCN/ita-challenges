<div class="dropdown">
  <button class="dropdown__trigger" data-testid="dropdown-trigger" type="button" (click)="toggleDropdown()">
    <img src="assets\icons\filter-icon.png" class="button_icon" />
    <span class="button_text">Filtres</span>
    <span class="button_arrow">›</span>
  </button>

  @if (isOpen()) {
    <div class="dropdown__overlay" data-testid="dropdown-overlay" (click)="closeDropdown()"></div>

    <div class="dropdown__menu" data-testid="dropdown-menu">
      <h3>Dificultat</h3>
      <div class="dropdown__menu__buttons">
        <button class="difficult-btn" type="button" [class.selected]="selectedDifficulty() === 'EASY'" (click)="selectDifficulty('EASY')"> <svg width="45" height="23" viewBox="0 0 45 23" fill="none" xmlns="http://www.w3.org/2000/svg"> <path fill-rule="evenodd" clip-rule="evenodd" d="M3.86996 4.7915L0.75 10.7543H3.86996L1.53023 18.2082L11.2807 10.7543H6.99087L9.3306 4.7915H3.86996Z" fill="#BA007C" stroke="#B91879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M17.7526 4.7915L14.6294 10.7543H17.7526L15.4104 18.2082L25.1711 10.7543H20.8768L23.2189 4.7915H17.7526Z" fill="#B91879" stroke="#B91879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M31.1691 4.7915L28.0459 10.7543H31.1691L28.8269 18.2082L38.5876 10.7543H34.2933L36.6354 4.7915H31.1691Z" stroke="#282828" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Fàcil </button>
        <button class="difficult-btn" type="button" [class.selected]="selectedDifficulty() === 'MEDIUM'" (click)="selectDifficulty('MEDIUM')"> <svg width="45" height="23" viewBox="0 0 45 23" fill="none" xmlns="http://www.w3.org/2000/svg"> <path fill-rule="evenodd" clip-rule="evenodd" d="M3.86996 4.7915L0.75 10.7543H3.86996L1.53023 18.2082L11.2807 10.7543H6.99087L9.3306 4.7915H3.86996Z" fill="#BA007C" stroke="#B91879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M31.0138 4.7915L27.8906 10.7543H31.0138L28.6717 18.2082L38.4323 10.7543H34.138L36.4802 4.7915H31.0138Z" stroke="#282828" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M17.5968 4.7915L14.4736 10.7543H17.5968L15.2547 18.2082L25.0153 10.7543H20.721L23.0632 4.7915H17.5968Z" stroke="#282828" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg> Mitjana </button>
        <button class="difficult-btn" type="button" [class.selected]="selectedDifficulty() === 'HARD'" (click)="selectDifficulty('HARD')"> <svg width="45" height="23" viewBox="0 0 45 23" fill="none" xmlns="http://www.w3.org/2000/svg"> <path fill-rule="evenodd" clip-rule="evenodd" d="M3.86996 4.7915L0.75 10.7543H3.86996L1.53023 18.2082L11.2807 10.7543H6.99087L9.3306 4.7915H3.86996Z" fill="#B91879" stroke="#B91879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M17.9191 4.7915L14.7959 10.7543H17.9191L15.5769 18.2082L25.3376 10.7543H21.0433L23.3854 4.7915H17.9191Z" fill="#B91879" stroke="#B91879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path fill-rule="evenodd" clip-rule="evenodd" d="M31.3356 4.7915L28.2124 10.7543H31.3356L28.9934 18.2082L38.7541 10.7543H34.4598L36.8019 4.7915H31.3356Z" fill="#B91879" stroke="#B91879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg> Difícil </button> 
      </div>
      <div class="dropdown__confirm"> <button class="confirm-btn" type="button" (click)="confirm()">Confirmar</button> </div>
    </div>
  }
</div>
