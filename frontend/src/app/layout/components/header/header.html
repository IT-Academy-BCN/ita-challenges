<header>
  <h1>IT ACADEMY</h1>

  @if (user()) {
    <div class="user__profile">
      <app-logout-button />
      <h4>
        {{ user()?.role ?? 'CONVIDAT' }}
      </h4>
      <div class="user__username">
        {{ user()?.username }}
      </div>
      <div>
        <img [src]="user()?.avatarUrl" alt="avatar" class="avatar__image" />
      </div>
    </div>
  } @else {
    <div class="user__profile">
    <div class="button__login">
      <button>Log In</button>
    </div>
      <h4>INVITAT</h4>
    </div>
  }
</header>
