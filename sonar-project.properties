# Used by sonar-scanner-cli in CI. (The sonar { } block in backend/build.gradle is not read by the CLI.)
sonar.projectKey=ita-challenges
sonar.projectName=Ita Challenges
sonar.qualitygate.wait=false
# From sonar-compile job artifacts (required when using SonarScanner CLI instead of ./gradlew sonar).
sonar.java.binaries=backend/account-service/build/classes/java/main,backend/challenge-service/build/classes/java/main
